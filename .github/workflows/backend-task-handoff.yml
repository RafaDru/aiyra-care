# Dispara Cursor Automation quando Claude entrega backend (PR task/* ou fila → review).
# Secrets: CURSOR_BACKEND_HANDOFF_WEBHOOK_URL, CURSOR_BACKEND_HANDOFF_WEBHOOK_KEY
name: Backend task handoff

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
    branches: [main]
  push:
    branches: [main]
    paths:
      - docs/coordination/BACKEND_TASK_QUEUE.md

jobs:
  notify-cursor-pr:
    if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'task/') || contains(github.event.pull_request.title, '[TASK-'))
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - name: Dispatch backend_task_handoff (PR)
        env:
          WEBHOOK_URL: ${{ secrets.CURSOR_BACKEND_HANDOFF_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.CURSOR_BACKEND_HANDOFF_WEBHOOK_KEY }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_KEY" ]; then
            echo "Secrets CURSOR_BACKEND_HANDOFF_* not set — skip (configure after creating Automation in Cursor UI)"
            exit 0
          fi
          TASK_ID=$(echo "${{ github.event.pull_request.title }}" | sed -n 's/.*\[\(TASK-[0-9]\{8\}-[0-9]\{2\}\)\].*/\1/p')
          if [ -z "$TASK_ID" ]; then TASK_ID="unknown"; fi
          BODY=$(jq -n \
            --arg type "backend_task_handoff" \
            --arg taskId "$TASK_ID" \
            --arg prUrl "${{ github.event.pull_request.html_url }}" \
            --argjson prNumber ${{ github.event.pull_request.number }} \
            --arg branch "${{ github.head_ref }}" \
            --arg queueStatus "review" \
            --arg trigger "github_actions_pr" \
            --arg repo "${{ github.repository }}" \
            --arg submittedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{type: $type, taskId: $taskId, prUrl: $prUrl, prNumber: $prNumber, branch: $branch, queueStatus: $queueStatus, trigger: $trigger, repo: $repo, submittedAt: $submittedAt}')
          curl -fsS -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $WEBHOOK_KEY" \
            -H "Content-Type: application/json" \
            -d "$BODY"

  notify-cursor-queue:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch backend_task_handoff (queue review)
        env:
          WEBHOOK_URL: ${{ secrets.CURSOR_BACKEND_HANDOFF_WEBHOOK_URL }}
          WEBHOOK_KEY: ${{ secrets.CURSOR_BACKEND_HANDOFF_WEBHOOK_KEY }}
        run: |
          if [ -z "$WEBHOOK_URL" ] || [ -z "$WEBHOOK_KEY" ]; then
            echo "Secrets CURSOR_BACKEND_HANDOFF_* not set — skip"
            exit 0
          fi
          if ! grep -E '\| review \|' docs/coordination/BACKEND_TASK_QUEUE.md; then
            echo "No review status in queue — skip"
            exit 0
          fi
          TASK_ID=$(grep -E '^\| TASK-' docs/coordination/BACKEND_TASK_QUEUE.md | head -1 | awk -F'|' '{print $2}' | tr -d ' ')
          PR_URL=$(grep -E '^\| TASK-' docs/coordination/BACKEND_TASK_QUEUE.md | head -1 | grep -oE 'https://github.com/[^)]+' | head -1 || true)
          BODY=$(jq -n \
            --arg type "backend_task_handoff" \
            --arg taskId "${TASK_ID:-unknown}" \
            --arg prUrl "${PR_URL:-}" \
            --argjson prNumber 0 \
            --arg branch "" \
            --arg queueStatus "review" \
            --arg trigger "github_actions_queue_push" \
            --arg repo "${{ github.repository }}" \
            --arg submittedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{type: $type, taskId: $taskId, prUrl: $prUrl, prNumber: $prNumber, branch: $branch, queueStatus: $queueStatus, trigger: $trigger, repo: $repo, submittedAt: $submittedAt}')
          curl -fsS -X POST "$WEBHOOK_URL" \
            -H "Authorization: Bearer $WEBHOOK_KEY" \
            -H "Content-Type: application/json" \
            -d "$BODY"
