name: Promote to Preview (Ambiente 2)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch ou tag a promover'
        required: true
        default: 'main'
      skip_gates:
        description: 'Pular re-run gates (só se já aprovado manualmente)'
        type: boolean
        default: false
      deploy_gcp:
        description: 'Build + deploy Cloud Run (requer GCP_SA_KEY no Environment preview)'
        type: boolean
        default: false
      skip_seed:
        description: 'Post-deploy sem seed:staging-refresh'
        type: boolean
        default: true
      run_post_deploy:
        description: 'Rodar probe + alerts-check no host (requer secrets preview + API up)'
        type: boolean
        default: false

jobs:
  gates:
    if: ${{ !inputs.skip_gates }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API
        working-directory: packages/api
        run: npm ci
      - name: Install Web
        working-directory: packages/web
        run: npm ci
      - name: Promotion gates
        run: node scripts/run-promotion-gates.mjs
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aiyracare
          OPS_SMOKE_SKIP_HTTP: '1'
      - name: Preview Dockerfiles check
        run: npm run build:preview-images -- --check-only
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: promotion-report
          path: promotion-report-last.md

  promote:
    needs: gates
    if: ${{ always() && (inputs.skip_gates || needs.gates.result == 'success') }}
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Promote summary (sem deploy GCP)
        if: ${{ !inputs.deploy_gcp }}
        run: |
          echo "=== Promote to Preview (Ambiente 2) ==="
          echo "Ref: ${{ inputs.ref }}"
          echo "Deploy GCP desligado — reexecute com deploy_gcp=true"
          echo "Runbook: docs/infra/GCP_PREVIEW_RUNBOOK.md"

      - name: Authenticate to Google Cloud
        if: ${{ inputs.deploy_gcp }}
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        if: ${{ inputs.deploy_gcp }}
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: ${{ inputs.deploy_gcp }}
        run: gcloud auth configure-docker ${{ vars.GCP_REGION || 'us-central1' }}-docker.pkg.dev --quiet

      - name: Deploy preview to Cloud Run
        if: ${{ inputs.deploy_gcp }}
        run: node scripts/gcp-preview-deploy.mjs --tag=${{ github.sha }}
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ARTIFACT_REGISTRY: ${{ vars.GCP_ARTIFACT_REGISTRY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CRYPTO_KEY: ${{ secrets.CRYPTO_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          API_PUBLIC_URL: ${{ secrets.API_PUBLIC_URL }}
          VITE_API_URL: ${{ secrets.API_PUBLIC_URL }}
          OPS_METRICS_KEY: ${{ secrets.OPS_METRICS_KEY }}
          OPS_ALERT_WEBHOOK_URL: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          OPS_ALERT_DASHBOARD_URL: ${{ secrets.OPS_ALERT_DASHBOARD_URL }}
          VITE_OPS_CONSOLE_URL: ${{ secrets.OPS_ALERT_DASHBOARD_URL }}
          OPS_ALERTS_DISPATCH_MODE: human_required
          OPS_ALERTS_MIN_SEVERITY: critical
          COMPLIANCE_GATE_ENABLED: '0'

  post-deploy:
    if: ${{ inputs.run_post_deploy }}
    needs: promote
    runs-on: ubuntu-latest
    environment: preview
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API
        working-directory: packages/api
        run: npm ci
      - name: Preview post-deploy checks
        run: node scripts/preview-post-deploy.mjs
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          API_PUBLIC_URL: ${{ secrets.API_PUBLIC_URL }}
          OPS_METRICS_KEY: ${{ secrets.OPS_METRICS_KEY }}
          SKIP_SEED: ${{ inputs.skip_seed && '1' || '0' }}
          CRYPTO_KEY: ${{ secrets.CRYPTO_KEY }}
