name: Staging

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API
        working-directory: packages/api
        run: npm ci
      - name: API build + validate + critical
        working-directory: packages/api
        run: |
          npm run build
          npm run validate:migrations
          npm run test:critical
      - name: Web build
        working-directory: packages/web
        run: npm ci && npm run build

  database-smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aiyracare
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: packages/api
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/aiyracare
      CRYPTO_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Apply migrations + seed staging mass
        run: |
          node scripts/apply-all-migrations.mjs
          node scripts/seed-demo-data.mjs --reset
          node scripts/seed-staging-volume.mjs --reset

  deploy-staging:
    runs-on: ubuntu-latest
    needs: database-smoke
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - name: Deploy placeholder
        run: |
          echo "Staging CI verde. Configure host + secrets (Environment staging)."
          echo "Ver docs/infra/DEPLOY_STAGING.md"
          echo "Próximo: SSH/rsync ou PaaS deploy + staging:probe-gate no host."
